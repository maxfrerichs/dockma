{{- /* The architecture diagram on the homepage; drawing markup, so it lives here rather than in the content. */ -}}
<div class="arch" role="img" aria-label="Architecture diagram: the docker CLI, the dockma CLI and apps using published localhost ports talk to dockmad, the dockma daemon on macOS, which forwards them over vsock to dockma-agent in the Linux guest; the agent reaches dockerd, docker-proxy and /bin/sh. $HOME and Rosetta are shared via virtiofs, the data disk via virtio-blk.">
  <div class="arch-box">
    <span class="arch-label">macOS</span>
    <div class="arch-chips"><span>docker</span><span>dockma</span><span>localhost:P</span></div>
  </div>
  <span class="arch-arrow">▼</span>
  <div class="arch-box accent">
    <strong>dockmad</strong>
    <span class="arch-sub">launchd job · owns the VM</span>
  </div>
  <div class="arch-bus"><span>vsock</span></div>
  <div class="arch-box">
    <span class="arch-label">Linux guest</span>
    <strong class="accent-text">dockma-agent</strong>
    <span class="arch-arrow">▼</span>
    <div class="arch-chips"><span>dockerd</span><span>docker-proxy</span><span>/bin/sh</span></div>
  </div>
  <p class="arch-mounts">virtiofs: $HOME, Rosetta · virtio-blk: /var/lib/docker</p>
</div>
