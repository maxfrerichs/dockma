- title: "Boots in ~{boot}s"
  body: "A custom-built {kernelSeries} LTS kernel with only what Docker needs, and a busybox userspace."
- title: "Shared $HOME directory"
  body: 'Your home directory is shared via virtiofs at the identical path, so <code>-v "$PWD:/src"</code> just works.'
- title: "Ports on localhost"
  body: "<code>-p 8080:80</code> is reachable at <code>localhost:8080</code>, IPv4 and IPv6. UDP (<code>-p 1053:53/udp</code>) and ports below 1024 work too. Gone when the container stops."
- title: "Containers reach the Mac"
  body: "<code>host.docker.internal</code> and <code>--add-host name:host-gateway</code> resolve to your Mac, as on Docker Desktop."
- title: "amd64 images via Rosetta"
  body: "<code>--platform linux/amd64</code> runs x86-64 images through Rosetta for Linux."
- title: "dockma shell"
  body: "A root shell in the VM through the guest agent, so it works even when dockerd doesn't."
- title: "Configurable"
  body: "<code>~/.dockma/daemon.json</code> is merged over dockerd's config. Add registry mirrors, proxies and your own CA certificates."
- title: "VPNs, kind and k3s"
  body: "The kernel has <code>/dev/net/tun</code> for Tailscale, and what kind, k3s and Docker-in-Docker need, network policies included."
- title: "A disk that gives space back"
  body: "A sparse data disk that grows with <code>dockma config --disk</code> and is trimmed hourly, so <code>data.img</code> shrinks on the Mac."
- title: "Self-healing"
  body: "Runs under launchd and restarts after a guest crash; a kernel panic reboots the guest in 5 s. <code>dockma stop</code> powers off cleanly."
- title: "Verified install"
  body: "One install script, checked against the release's <code>SHA256SUMS</code>. <code>dockma install</code> fetches the matching guest image."
- title: "Free and open source"
  body: "MIT licensed. The whole guest builds from one Dockerfile with <code>make guest</code>, so you can read and rebuild all of it."
