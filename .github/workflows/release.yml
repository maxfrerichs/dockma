# Builds the CLI and the guest for a version tag and drafts a GitHub release
# with both tarballs, SHA256SUMS and build provenance attestations. The notes
# are the tag's CHANGELOG.md section. Review the draft, then publish it.
#
# Pushing a tag such as 0.2.0 runs this. For a tag pushed before this
# workflow existed, run it by hand with that tag.
name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, such as 0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fails fast, before the macOS build, when the tag has no release notes.
  notes:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a version tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # The script from this workflow's commit; the changelog from the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/release-notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: tagged
          persist-credentials: false
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Extract notes
        run: python3 -I scripts/release-notes.py "${{ steps.tag.outputs.tag }}" tagged/CHANGELOG.md > notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  cli:
    needs: notes
    uses: ./.github/workflows/cli.yml
    with:
      version: ${{ needs.notes.outputs.tag }}
      ref: refs/tags/${{ needs.notes.outputs.tag }}

  guest:
    needs: notes
    uses: ./.github/workflows/guest.yml
    with:
      version: ${{ needs.notes.outputs.tag }}
      ref: refs/tags/${{ needs.notes.outputs.tag }}

  publish:
    needs: [notes, cli, guest]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum dockma-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dockma-*.tar.gz
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.notes.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "dockma $TAG" --notes-file dist/notes.md \
            dist/dockma-*.tar.gz dist/SHA256SUMS
