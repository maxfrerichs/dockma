# Builds the website (site/, Hugo) and deploys it to GitHub Pages.
# One-time setup: Settings -> Pages -> Source = "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/site-prepare.py
      - install.sh
      - vm/Dockerfile
      - Sources/DockmaCLI/DockmaCLI.docc/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0
  HUGO_SHA256: 787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum -c -
          tar xzf hugo.tar.gz hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
      - id: pages
        uses: actions/configure-pages@v5
      - name: Generate repo-derived inputs
        run: python3 -I scripts/site-prepare.py .
      - name: Build
        env:
          HUGO_PARAMS_REPO: ${{ github.repository }}
        run: hugo --source site --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
